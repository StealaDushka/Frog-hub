<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Frog Hub</title>
  <!-- Подключаем стили -->
  <style>
    :root {
      --bg: #121212; /* Тёмный фон */
      --accent: #00C759; /* Акцентный цвет */
      --text: #fff;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; color: var(--text); }
    body { background-color: var(--bg); display: flex; height: 100vh; }

    .app {
      width: 640px; max-width: 100%; min-height: 100%;
      display: grid; grid-template-columns: 3fr 7fr;
      gap: 1rem; padding: 1rem;
    }

    /* Лого */
    header {
      position: sticky; top: 0; z-index: 10;
      background: var(--accent);
      padding: 1rem; display: flex; align-items: center;
      column-gap: 1rem;
    }
    .logo {
      width: 32px; height: 32px;
      background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0OCIgaGVpZ2h0PSI0OCIgdmlld0JveD0iMCAwIDQ4IDQ4Ij4KICA8Y2lyY2xlIGN4PSIyNCIgY3k9IjI0IiByPSIyMiIgZmlsbD0ibGlnaHQtbWludCIgc3Ryb2tlPSJncmVlbjEiPjwvc2NpcmNsZT4KICA8cGF0aCBkPSJNMTguNSAyMS4yIEwxOC41IDE2LjUgTDEyIDkuNiBDOS4xNyA5LjYgNiAxMi4xNyA2IDE2LjUgTDYuNSAyMS4yIEwyMSAzMS41IEwyMSAzNSBMNDcuNSAzNSBMNDcgMzEuNSBMMzEgMjEuMiBMMzAgMTYuNSBDMzAuMDMgMTQuNTggMjkuOTcgMTMuNjkgMjguNSAxMy42OSBaIE0yOCAyMS4yIEwyOCAxNi41IEwyMi41IDEzLjY5IEwyMi41IDExLjMxIEwyOC41IDExLjMxIEwzMSAzMS41IEwzMSAzNSBMNDUuNSAzNSBMNDUuNSAzMS41IEwyOC41IDIxLjIgWiIgZmlsbD0icHJpbWFyeSIgc3Ryb2tlPSJncmVlbjEiPjwvcGF0aD4KPC9zdmc+Cg==');
      mask-repeat: no-repeat; mask-position: center;
    }

    h1 { font-size: 1.2em; margin: 0; }

    /* Чаты */
    nav ul { list-style-type: none; }
    li.chat { 
      padding: 1rem; cursor: pointer; transition: all 0.2s ease-in-out;
      &:hover { background: rgba(255,255,255,0.05); }
    }

    /* Сообщения */
    .chat-window { overflow-y: auto; padding-bottom: 60px; }
    .message {
      display: flex; align-items: start; margin-top: 1rem;
      &.mine { justify-content: end; }
    }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); }
    .msg-bubble {
      max-width: 70%; padding: 0.75rem; border-radius: 1rem;
      word-wrap: break-word;
      &.incoming { background: rgba(255,255,255,0.1); margin-left: 0.5rem; }
      &.outgoing { background: var(--accent); color: white; margin-right: 0.5rem; }
    }

    /* Поле ввода */
    footer {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--accent); padding: 1rem;
      display: flex; align-items: center; gap: 1rem;
    }
    textarea { flex: 1; resize: none; outline: none; padding: 0.5rem; }
    button { background: transparent; border: none; cursor: pointer; }
  </style>
</head>
<body>
<div class="app">
  <!-- Шапка приложения -->
  <header>
    <div class="logo"></div>
    <h1>Frog Hub</h1>
  </header>

  <!-- Левая панель - список чатов -->
  <nav>
    <ul>
      <li class="chat">Алексей • Вы: Привет! • 14:30</li>
      <li class="chat active">Маша • Я тут • 16:45</li>
      <li class="chat">Команда FrogHub • +3 сообщения • Вчера</li>
    </ul>
  </nav>

  <!-- Правая панель - сам чат -->
  <section class="chat-window">
    <div class="message incoming">
      <div class="avatar"></div>
      <div class="msg-bubble incoming">Привет! Как дела?</div>
    </div>
    <div class="message outgoing">
      <div class="msg-bubble outgoing">Всё круто!</div>
    </div>
    <div class="message incoming">
      <div class="avatar"></div>
      <div class="msg-bubble incoming">Как продвигается разработка?</div>
    </div>
  </section>

  <!-- Нижняя панель - поле ввода -->
  <footer>
    <textarea placeholder="Сообщение..."></textarea>
    <button><svg viewBox="0 0 24 24"><path d="M2 20 L12 12 L22 20 Z"/></svg></button>
  </footer>
</div>
</body>
</html>
